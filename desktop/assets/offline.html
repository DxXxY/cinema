<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>Together Cinema</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090a12; color: #f3f4fb; font-family: "Segoe UI", sans-serif; text-align: center; }
    .box { max-width: 420px; padding: 24px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #858ba3; font-size: 13px; line-height: 1.7; margin: 0 0 20px; }
    button { border: 0; border-radius: 9px; padding: 11px 18px; font-weight: 700; color: #171224; background: linear-gradient(110deg, #c4b5fd, #edaddd); cursor: pointer; }
    small { display: block; margin-top: 14px; color: #626981; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="">
    <h1>Не получается подключиться</h1>
    <p>Проверь интернет. Если сервер долго не открывали, он просыпается до минуты — приложение попробует снова само.</p>
    <button id="retry">Попробовать снова</button>
    <small id="count"></small>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url') || 'https://cinema-geht.onrender.com';
    const go = () => { location.href = target; };
    document.getElementById('retry').onclick = go;
    let left = 10;
    setInterval(() => {
      left -= 1;
      document.getElementById('count').textContent = `Повтор через ${left} с`;
      if (left <= 0) go();
    }, 1000);
  </script>
</body>
</html>
